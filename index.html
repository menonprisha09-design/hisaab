<!doctype html>
<html lang="en-IN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hisaab | Shop Ledger</title>
  <link rel="stylesheet" href="hisaab.css">
  <script src="hisaab.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18m4-13h3m-3 4h3"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-15a3 3 0 0 1 0 6m5 9v-2a4 4 0 0 0-3-4"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 15A8.5 8.5 0 0 1 9 3.5 8.5 8.5 0 1 0 20.5 15Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4 4"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 8V6a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h14v8a2 2 0 0 1-2 2H6a3 3 0 0 1-3-3V7m17 6h-5a2 2 0 0 0 0 4h5m-5-2h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M18 6 6 18m10 0H6V8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 16-5-5-7 9"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 17.4 4 21l3.8-1a8.5 8.5 0 1 0-2.8-2.6Z"/><path d="M9 8c.4-.5 1.2 1 1.4 1.5.2.4-.6.8-.4 1.2.5 1 1.2 1.7 2.3 2.3.4.2.8-.6 1.2-.4.5.2 2 1 1.5 1.4-1 1.2-2.7.6-4.6-1.3S7.8 9 9 8Z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar" aria-label="Sidebar">
      <a href="#overview" class="brand"><span class="brand-icon"><svg><use href="#i-book"/></svg></span><span><strong>Hisaab<span>.</span></strong><small>SHOP LEDGER</small></span></a>
      <nav class="nav" aria-label="Main navigation">
        <p>WORKSPACE</p>
        <a href="#overview" id="nav-overview" class="nav-item"><svg><use href="#i-grid"/></svg>Overview</a>
        <a href="#customers" id="nav-customers" class="nav-item"><svg><use href="#i-people"/></svg>Customers</a>
        <p>TOOLS</p>
        <button type="button" class="nav-item" data-action="import"><svg><use href="#i-import"/></svg>Import JSON</button>
      </nav>
      <div class="sidebar-footer"><span class="local-dot"></span><div><strong>Stored on this device</strong><small>No account needed</small></div></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <p class="breadcrumb"><svg><use href="#i-grid"/></svg><span>Workspace</span><svg class="crumb-arrow"><use href="#i-chevron"/></svg><strong id="location">Overview</strong></p>
        <a href="#overview" class="brand mobile-brand"><span class="brand-icon"><svg><use href="#i-book"/></svg></span><strong>Hisaab<span>.</span></strong></a>
        <div class="top-actions"><button class="icon-button" id="lang" type="button" aria-label="Toggle Hindi labels" title="Toggle Hindi labels">EN</button><button class="icon-button mobile-import" data-action="import" aria-label="Import JSON" title="Import JSON"><svg><use href="#i-import"/></svg></button><button class="icon-button" id="theme" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><svg><use href="#i-moon"/></svg></button></div>
      </header>
      <div id="storage-alert" class="storage-alert" role="status" hidden></div>
      <div class="content" id="view"></div>
      <footer class="footer"><svg><use href="#i-lock"/></svg> Your ledger is private and saved in this browser.</footer>
    </main>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="close" aria-label="Close dialog"><svg><use href="#i-close"/></svg></button></div>
    <div id="dialog-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
